name: One-time direct footer source repair

on:
  push:
    paths:
      - '.github/workflows/footer-direct-source-repair-once.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Repair footer source content directly
        run: node scripts/repair-footer-sources-once.mjs
      - name: Verify global footer source audit
        run: node scripts/audit-nexus-footer-standard.mjs
      - name: Verify architecture audit
        run: node scripts/audit-web-architecture.mjs
      - name: Commit direct footer source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nexus ai-law-tech-foresight legal-philosophy legal-knowledge three-minute-break toeic-human-100
          git diff --cached --quiet && exit 1
          git commit -m "Fix all footer sources to canonical two-line format"
          git push
