name: Refresh Nexus project status

on:
  push:
    branches: [main]
    paths:
      - 'nexus/**'
      - '!nexus/project-status.json'
      - 'nexus.project.json'
      - 'three-minute-break/**'
      - 'toeic-human-100/**'
      - 'legal-knowledge/**'
      - 'ai-law-tech-foresight/**'
      - 'legal-philosophy/**'
  schedule:
    - cron: '15 15 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nexus-status-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Refresh Nexus project status
        run: node nexus/scripts/update-status.mjs

      - name: Commit Nexus status when changed
        shell: bash
        run: |
          if git diff --quiet -- nexus/project-status.json; then
            echo "Nexus project status is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nexus/project-status.json
          git commit -m "Refresh Nexus project status"
          git push
