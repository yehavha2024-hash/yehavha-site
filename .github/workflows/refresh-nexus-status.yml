name: Refresh Nexus project status

on:
  push:
    branches: [main]
    paths:
      - 'nexus/**'
      - '!nexus/project-status.json'
      - '!nexus/sitemap.xml'
      - '!nexus/index.html'
      - '!nexus/portal-v2.css'
      - '!nexus/nexus-standard.css'
      - '!nexus/portal-v2.js'
      - '!nexus/_headers'
      - '!nexus/README.md'
      - '!nexus/legal-policy/**'
      - '!nexus/research-education/**'
      - '!nexus/resources-services/**'
      - '!nexus/assets/**'
      - '!nexus/scripts/**'
      - 'nexus/scripts/update-sitemap.mjs'
      - '!nexus/functions/**'
      - 'nexus.project.json'
      - 'three-minute-break/**'
      - 'toeic-human-100/**'
      - 'legal-knowledge/**'
      - 'ai-law-tech-foresight/**'
      - 'legal-philosophy/**'
      - 'scripts/ci/safe-content-commit.sh'
      - '.github/workflows/refresh-nexus-status.yml'
  schedule:
    - cron: '15 15 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: yehavha-main-content-writer
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Refresh Nexus project status
        run: node nexus/scripts/update-status.mjs

      - name: Refresh Nexus sitemap
        run: node nexus/scripts/update-sitemap.mjs

      - name: Publish Nexus generated metadata when changed
        shell: bash
        run: bash scripts/ci/safe-content-commit.sh "Refresh Nexus generated metadata" nexus/project-status.json nexus/sitemap.xml
