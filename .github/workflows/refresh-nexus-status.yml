name: Refresh Nexus project status

on:
  push:
    branches: [main]
    paths-ignore:
      - 'nexus/project-status.json'
      - 'nexus/projects.generated.json'
      - 'three-minute-break/CONTENT_CATALOG.csv'
      - 'three-minute-break/VALIDATION_REPORT.md'
      - 'toeic-human-100/content.json'
      - 'toeic-human-100/CONTENT_CATALOG.csv'
      - 'toeic-human-100/VALIDATION_REPORT.md'
  schedule:
    - cron: '15 15 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nexus-status-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate AI foresight academic depth
        run: node ai-law-tech-foresight/scripts/validate-academic.mjs

      - name: Validate and export 3-minute break content
        run: node three-minute-break/scripts/export-content.mjs

      - name: Validate and export TOEIC 100-day content
        run: node toeic-human-100/scripts/export-content.mjs

      - name: Generate Nexus project status
        run: node nexus/scripts/update-status.mjs

      - name: Commit generated project data
        shell: bash
        run: |
          if git diff --quiet -- \
            nexus/project-status.json nexus/projects.generated.json \
            three-minute-break/CONTENT_CATALOG.csv three-minute-break/VALIDATION_REPORT.md \
            toeic-human-100/content.json toeic-human-100/CONTENT_CATALOG.csv toeic-human-100/VALIDATION_REPORT.md; then
            echo "Generated project data is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            nexus/project-status.json nexus/projects.generated.json \
            three-minute-break/CONTENT_CATALOG.csv three-minute-break/VALIDATION_REPORT.md \
            toeic-human-100/content.json toeic-human-100/CONTENT_CATALOG.csv toeic-human-100/VALIDATION_REPORT.md
          git commit -m "Refresh generated project data"
          git push
