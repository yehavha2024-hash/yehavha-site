name: Web Architecture Audit

on:
  push:
    paths:
      - 'ai-law-tech-foresight/**'
      - 'legal-philosophy/**'
      - 'legal-knowledge/**'
      - 'three-minute-break/**'
      - 'toeic-human-100/**'
      - 'scripts/audit-web-architecture.mjs'
      - 'WEB_PROJECT_STANDARD.md'
      - '.github/workflows/web-architecture-audit.yml'
  pull_request:
    paths:
      - 'ai-law-tech-foresight/**'
      - 'legal-philosophy/**'
      - 'legal-knowledge/**'
      - 'three-minute-break/**'
      - 'toeic-human-100/**'
      - 'scripts/audit-web-architecture.mjs'
      - 'WEB_PROJECT_STANDARD.md'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/audit-web-architecture.mjs
