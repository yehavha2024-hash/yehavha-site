name: Web Architecture Audit

on:
  push:
    paths:
      - 'ai-law-tech-foresight/**'
      - 'legal-philosophy/**'
      - 'legal-knowledge/**'
      - 'three-minute-break/**'
      - 'toeic-human-100/**'
      - 'nexus/**'
      - 'scripts/audit-web-architecture.mjs'
      - 'scripts/audit-repo-hygiene.mjs'
      - 'scripts/audit-style-ownership.mjs'
      - 'WEB_PROJECT_STANDARD.md'
      - '.github/workflows/web-architecture-audit.yml'
  pull_request:
    paths:
      - 'ai-law-tech-foresight/**'
      - 'legal-philosophy/**'
      - 'legal-knowledge/**'
      - 'three-minute-break/**'
      - 'toeic-human-100/**'
      - 'nexus/**'
      - 'scripts/audit-web-architecture.mjs'
      - 'scripts/audit-repo-hygiene.mjs'
      - 'scripts/audit-style-ownership.mjs'
      - 'WEB_PROJECT_STANDARD.md'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: node scripts/audit-web-architecture.mjs
      - run: node scripts/audit-repo-hygiene.mjs
      - run: node scripts/audit-style-ownership.mjs
      - name: Validate Nexus portal enhancement runtime
        run: |
          node --check nexus/portal-v2.js
          node --check nexus/functions/_middleware.js
          node --check nexus/functions/go.js
          node --check nexus/functions/api/access.js
          node --check nexus/functions/lib/metrics.js
          node nexus/scripts/audit-portal-enhancements.mjs
      - name: Validate article archive runtime script
        run: node --check nexus/articles/articles.js
      - name: Validate legal mind runtime scripts
        run: |
          node --check legal-knowledge/legal-mind/data.js
          node --check legal-knowledge/legal-mind/app.js
      - name: Validate 3 minute break runtime content
        run: node three-minute-break/scripts/export-content.mjs
      - run: node nexus/scripts/audit-runtime.mjs
      - if: github.event_name == 'push'
        run: node nexus/scripts/audit-live-urls.mjs
