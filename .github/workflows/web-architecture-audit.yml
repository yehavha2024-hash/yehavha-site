name: Web Architecture Audit
# Read-only regression audit for Nexus and related web projects.

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Normalize Footer source on work branch
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/nexus-footer-main-standard-20260906'
        run: |
          node scripts/_normalize-nexus-footer-worktree.mjs
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add nexus ai-law-tech-foresight legal-philosophy legal-knowledge three-minute-break toeic-human-100
            git commit -m "normalize existing footer html sources"
            git push origin HEAD:${{ github.head_ref }}
          fi
      - run: node scripts/audit-web-architecture.mjs
      - run: node scripts/audit-business-footer.mjs
      - run: node scripts/audit-research-track-footer.mjs
      - run: node scripts/audit-nexus-footer-standard.mjs
      - run: node scripts/audit-repo-hygiene.mjs
      - run: node scripts/audit-style-ownership.mjs
      - run: node scripts/audit-nexus-light-theme.mjs
      - name: Validate Nexus portal ownership
        run: node nexus/scripts/audit-portal-enhancements.mjs
      - name: Validate legal philosophy citation coverage
        run: |
          node --input-type=module <<'NODE'
          globalThis.window = globalThis;
          await import('./legal-philosophy/data.js');
          await import('./legal-philosophy/data-core-axes-2.js');
          await import('./legal-philosophy/data-debates-3.js');
          await import('./legal-philosophy/research-citations-6a.js');
          await import('./legal-philosophy/research-citations-6b.js');
          await import('./legal-philosophy/research-citations-6c.js');
          await import('./legal-philosophy/research-citations-6d.js');
          const audit = globalThis.LEGAL_PHILOSOPHY_CITATION_AUDIT;
          if (!audit) throw new Error('legal philosophy citation audit missing');
          if (audit.totalExpected !== 56) throw new Error(`expected 56 items, got ${audit.totalExpected}`);
          if (audit.totalCovered !== 56 || audit.missingIds.length) throw new Error(`citation coverage incomplete: ${audit.totalCovered}/${audit.totalExpected}; missing=${audit.missingIds.join(',')}`);
          if (audit.uniformVerified !== 19 || audit.uniformExpected !== 19 || !audit.uniformComplete) throw new Error(`remaining-item verification incomplete: ${audit.uniformVerified}/${audit.uniformExpected}`);
          if (audit.quoteVerified !== 19 || !audit.complete) throw new Error(`quote verification incomplete: ${audit.quoteVerified}/19`);
          console.log(`Legal philosophy citations: ${audit.totalCovered}/${audit.totalExpected}; remaining verification ${audit.uniformVerified}/${audit.uniformExpected}`);
          NODE
      - name: Validate 3 minute break runtime content
        run: node three-minute-break/scripts/export-content.mjs
      - run: node nexus/scripts/audit-runtime.mjs
      - name: Validate deployed live URLs
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: node nexus/scripts/audit-live-urls.mjs
