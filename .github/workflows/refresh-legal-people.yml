name: Refresh Legal Intelligence people and market

on:
  push:
    branches: [main]
    paths:
      - 'nexus/legal-intelligence/legal-people-curated.json'
      - 'nexus/legal-intelligence/legal-people-sources.json'
      - 'nexus/legal-intelligence/scripts/collect-legal-people.mjs'
      - 'nexus/legal-intelligence/scripts/audit-legal-people.mjs'
      - 'scripts/report-airtable-status.mjs'
      - '.github/workflows/refresh-legal-people.yml'
  schedule:
    # 00:40 UTC = 09:40 KST every Monday.
    - cron: '40 0 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: legal-intelligence-people-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Validate collector scripts
        run: |
          node --check nexus/legal-intelligence/scripts/collect-legal-people.mjs
          node --check nexus/legal-intelligence/scripts/audit-legal-people.mjs
          node --check scripts/report-airtable-status.mjs

      - name: Collect public legal people and market updates
        run: node nexus/legal-intelligence/scripts/collect-legal-people.mjs

      - name: Evaluate required and optional source health
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('nexus/legal-intelligence/legal-people.json', 'utf8'));
          const cfg = JSON.parse(fs.readFileSync('nexus/legal-intelligence/legal-people-sources.json', 'utf8'));
          const failures = Array.isArray(data.sourceFailures) ? data.sourceFailures : [];
          const sources = Array.isArray(cfg.sources) ? cfg.sources : [];
          const byId = new Map(sources.map(source => [source.id, source]));
          const requiredSources = sources.filter(source => source.allowFailure !== true);
          const requiredFailures = failures.filter(failure => byId.get(failure.source)?.allowFailure !== true);
          const optionalFailures = failures.filter(failure => byId.get(failure.source)?.allowFailure === true);
          const requiredSucceeded = Math.max(0, requiredSources.length - requiredFailures.length);

          const health = {sourceFailures: requiredFailures, optionalFailures};
          fs.writeFileSync('/tmp/legal-people-health.json', JSON.stringify(health, null, 2));

          console.log(`Required legal-people source health: ${requiredSucceeded}/${requiredSources.length} source(s) succeeded.`);
          if (optionalFailures.length) {
            console.log('Optional source failures:', optionalFailures);
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `### 선택 원천 상태\n${optionalFailures.map(item => `- ${item.source}: ${item.message}`).join('\n')}\n`);
          }
          if (requiredSources.length && requiredSucceeded === 0) {
            console.error('Every required legal-people source failed:', requiredFailures);
            process.exit(1);
          }
          NODE

      - name: Validate refreshed data
        run: node nexus/legal-intelligence/scripts/audit-legal-people.mjs

      - name: Commit data when changed
        shell: bash
        run: |
          if git diff --quiet -- nexus/legal-intelligence/legal-people.json; then
            echo "No legal people changes detected."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nexus/legal-intelligence/legal-people.json
          git commit -m "Refresh Legal Intelligence people data"

          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin main; then
              exit 0
            fi
            echo "Push raced with another main update; retrying (${attempt}/3)."
            sleep $((attempt * 2))
          done

          echo "Unable to push refreshed legal people data after 3 attempts."
          exit 1

      - name: Report legal people refresh status to Airtable
        if: always()
        continue-on-error: true
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_NEXUS_TOKEN }}
          AIRTABLE_NEXUS_RECORD_ID: recVAJTq4vq0nlch2
          NEXUS_REFRESH_STATUS: ${{ job.status }}
          NEXUS_STATUS_SOURCE_PATH: nexus/legal-intelligence/legal-people.json
          NEXUS_STATUS_DATE_FIELD: updatedAt
          NEXUS_STATUS_WARNING_SOURCE_PATH: /tmp/legal-people-health.json
          NEXUS_STATUS_WARNING_FIELD: sourceFailures
          GITHUB_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/report-airtable-status.mjs
