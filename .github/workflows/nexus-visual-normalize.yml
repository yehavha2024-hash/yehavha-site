name: Nexus Visual Normalize

on:
  push:
    paths:
      - '.github/workflows/nexus-visual-normalize.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Normalize Nexus visual system v2
        run: node scripts/nexus-visual-normalize.mjs
      - name: Commit normalized canonical files
        run: |
          if git diff --quiet; then
            echo "No visual normalization changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize Nexus black text and detail-cell contrast"
          git push
