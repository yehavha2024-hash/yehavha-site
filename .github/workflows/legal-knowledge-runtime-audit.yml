name: Legal Knowledge Runtime Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Run legal knowledge runtime audit
        run: node legal-knowledge/run-runtime-audit.mjs
      - name: Upload runtime audit diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legal-knowledge-runtime-audit
          if-no-files-found: warn
          path: legal-knowledge/.audit/
