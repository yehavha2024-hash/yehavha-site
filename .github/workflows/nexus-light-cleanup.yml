name: Nexus Light Cleanup

on:
  push:
    paths:
      - 'scripts/run-nexus-light-cleanup.mjs'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: node scripts/run-nexus-light-cleanup.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nexus/portal-enhancements.css nexus/toeic-human-v2/style.css nexus/university/university.css
          git commit -m "Remove remaining dark Nexus surfaces" || exit 0
          git push
