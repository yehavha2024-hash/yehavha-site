name: YEHAVHA NEWS pre-merge quality gate

on:
  pull_request:
    paths:
      - 'nexus/news/articles/**'
      - 'nexus/news/news-data.js'
      - 'nexus/news/sitemap.xml'
      - 'nexus/scripts/normalize-news-articles.mjs'
      - 'nexus/scripts/sync-news-registry.mjs'
      - 'nexus/scripts/audit-news-architecture.mjs'
      - 'nexus/scripts/audit-news-quality.mjs'
      - '.github/workflows/news-quality-audit.yml'
      - '.github/workflows/normalize-news-articles.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yehavha-news-premerge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Validate NEWS architecture
        run: node nexus/scripts/audit-news-architecture.mjs

      - name: Validate article quality
        run: node nexus/scripts/audit-news-quality.mjs
