name: NEXUS footer identifiers one-shot

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'fix/nexus-footer-main-standard-20260906'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/nexus-footer-main-standard-20260906
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Insert researcher identifiers only inside existing Footer HTML
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const BUSINESS = '스카이예슈아 · 사업자등록번호 536-38-01234 · 대표 이명훈';
          const RESEARCH = '국가연구자번호 13169680 · ISNI 0000000513760591 · ORCID 0009-0000-6095-8067';
          const files = [
            'nexus/ai-legal-glossary/index.html',
            'nexus/ai-music-archive/index.html',
            'nexus/ai-work-infrastructure/index.html',
            'nexus/edtech-research/ai-edtech-platform/index.html',
            'nexus/edtech-research/ai-learning/index.html',
            'nexus/edtech-research/assessment-feedback/index.html',
            'nexus/edtech-research/field-practice/index.html',
            'nexus/edtech-research/foundations/index.html',
            'nexus/edtech-research/index.html',
            'nexus/edtech-research/instructional-design/index.html',
            'nexus/edtech-research/learning-analytics/index.html',
            'nexus/edtech-research/research-lab/index.html',
            'nexus/edtech-research/responsible-ai/index.html',
            'nexus/intelligence-briefing/index.html',
            'nexus/investment-strategy/index.html',
            'nexus/korea-social-intelligence/index.html',
            'nexus/legal-intelligence/index.html',
            'nexus/living-law/index.html',
            'nexus/local-government-planning/index.html',
            'nexus/toeic-human-v2/index.html',
            'nexus/university/course.html',
            'nexus/university/index.html',
            'nexus/university/quality-audit.html'
          ];

          const escapeRe = value => value.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
          const businessRe = new RegExp(`<p\\b[^>]*class=["'][^"']*\\bbusiness-meta\\b[^"']*["'][^>]*>\\s*${escapeRe(BUSINESS)}\\s*<\\/p>`, 'i');

          for (const file of files) {
            const original = fs.readFileSync(file, 'utf8');
            let footerChanges = 0;
            const next = original.replace(/<footer\b[^>]*>[\s\S]*?<\/footer>/gi, footer => {
              if (!/data-footer-standard=["']v2["']/i.test(footer) || !footer.includes(BUSINESS)) return footer;
              if (footer.includes(RESEARCH)) return footer;
              const business = footer.match(businessRe);
              if (!business) throw new Error(`${file}: business-meta paragraph not found inside Footer`);
              footerChanges += 1;
              return footer.replace(business[0], `${business[0]}\n<p class="research-identifiers">${RESEARCH}</p>`);
            });
            if (footerChanges !== 1) throw new Error(`${file}: expected exactly one Footer change, got ${footerChanges}`);
            fs.writeFileSync(file, next, 'utf8');
            console.log(`patched ${file}`);
          }
          NODE
      - name: Verify exact HTML scope
        run: |
          git diff --check
          expected=$(cat <<'EOF' | sort
          nexus/ai-legal-glossary/index.html
          nexus/ai-music-archive/index.html
          nexus/ai-work-infrastructure/index.html
          nexus/edtech-research/ai-edtech-platform/index.html
          nexus/edtech-research/ai-learning/index.html
          nexus/edtech-research/assessment-feedback/index.html
          nexus/edtech-research/field-practice/index.html
          nexus/edtech-research/foundations/index.html
          nexus/edtech-research/index.html
          nexus/edtech-research/instructional-design/index.html
          nexus/edtech-research/learning-analytics/index.html
          nexus/edtech-research/research-lab/index.html
          nexus/edtech-research/responsible-ai/index.html
          nexus/intelligence-briefing/index.html
          nexus/investment-strategy/index.html
          nexus/korea-social-intelligence/index.html
          nexus/legal-intelligence/index.html
          nexus/living-law/index.html
          nexus/local-government-planning/index.html
          nexus/toeic-human-v2/index.html
          nexus/university/course.html
          nexus/university/index.html
          nexus/university/quality-audit.html
          EOF
          )
          actual=$(git diff --name-only | sort)
          test "$actual" = "$expected"
      - name: Commit direct HTML changes and remove one-shot workflow
        run: |
          rm .github/workflows/nexus-footer-identifiers-one-shot.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nexus .github/workflows/nexus-footer-identifiers-one-shot.yml
          git commit -m "add researcher identifiers to remaining nexus footers"
          git push origin HEAD:fix/nexus-footer-main-standard-20260906
