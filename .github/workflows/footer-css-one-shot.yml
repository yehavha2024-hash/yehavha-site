name: Footer CSS one-shot

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'fix/nexus-footer-main-standard-20260906'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/nexus-footer-main-standard-20260906
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Patch only existing footer CSS owners
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const files = {
            'legal-knowledge/project-standard.css': [
              ['>div:first-child strong{display:block;font-size:15px!important;font-weight:650!important;color:var(--nxs-text)!important}', '>div:first-child strong{display:block;font-size:15px!important;font-weight:700!important;color:var(--nxs-text)!important}'],
              ['>div:first-child p{margin:4px 0 0!important;font-size:13.5px!important;color:#111111!important}', '>div:first-child p{margin:5px 0 0!important;font-size:13.5px!important;line-height:1.72!important;color:#111111!important}'],
              ['.footer-note{max-width:960px!important;margin:16px auto 0!important;padding-top:15px!important;border-top:1px solid var(--nxs-line-soft)!important;text-align:center!important}', '.footer-note{max-width:960px!important;margin:14px auto 0!important;padding-top:14px!important;border-top:1px solid var(--nxs-line-soft)!important;text-align:center!important}'],
              ['.business-meta{color:var(--nxs-text)!important;font-weight:650!important}', '.business-meta{color:var(--nxs-text)!important;font-weight:700!important}'],
              ['.ai-disclosure{margin-top:6px!important;font-size:13.5px!important;line-height:1.75!important}', '.ai-disclosure{margin-top:7px!important;font-size:13.5px!important;line-height:1.75!important}'],
              ['.site-footer[data-footer-standard="v2"] a{color:var(--nxs-accent)!important;text-decoration:none!important}', '.site-footer[data-footer-standard="v2"] a{color:var(--nxs-accent)!important;font-weight:700!important;text-decoration:none!important}'],
              ['.footer-note>a{display:inline-block;margin-top:7px!important;font-size:13.5px!important;font-weight:650!important}', '.footer-note>a{display:inline-block;margin-top:7px!important;font-size:13.5px!important;font-weight:700!important}']
            ],
            'legal-knowledge/ai-literature/styles.css': [
              ['.site-footer[data-footer-standard="v2"] strong{display:block;color:var(--text);font-size:15px;font-weight:650}', '.site-footer[data-footer-standard="v2"] strong{display:block;color:var(--text);font-size:15px;font-weight:700;line-height:1.5}'],
              ['.site-footer[data-footer-standard="v2"]>div:first-child p{margin:4px 0 0;font-size:13.5px}', '.site-footer[data-footer-standard="v2"]>div:first-child p{margin:5px 0 0;font-size:13.5px;line-height:1.72;color:#111111}'],
              ['.site-footer[data-footer-standard="v2"] .footer-note{max-width:960px;margin:14px auto 0;padding-top:13px;border-top:1px solid var(--line-soft);text-align:center}', '.site-footer[data-footer-standard="v2"] .footer-note{max-width:960px;margin:14px auto 0;padding-top:14px;border-top:1px solid var(--line-soft);text-align:center}.site-footer[data-footer-standard="v2"] .footer-note p{margin:0;color:#111111;font-size:14px;line-height:1.75;text-align:center}'],
              ['.site-footer[data-footer-standard="v2"] .business-meta{color:var(--text);font-weight:650}', '.site-footer[data-footer-standard="v2"] .business-meta{color:var(--text);font-weight:700}'],
              ['.site-footer[data-footer-standard="v2"] .ai-disclosure{margin-top:6px;font-size:13.5px}', '.site-footer[data-footer-standard="v2"] .ai-disclosure{margin-top:7px;font-size:13.5px;line-height:1.75}'],
              ['.site-footer[data-footer-standard="v2"] .footer-note a{display:inline-block;margin-top:6px;color:var(--accent);text-decoration:none;font-size:13.5px;font-weight:650}', '.site-footer[data-footer-standard="v2"] .footer-note p a{color:var(--accent);font-size:14px;font-weight:700;text-decoration:none}.site-footer[data-footer-standard="v2"] .footer-note>a{display:inline-block;margin-top:7px;color:var(--accent);text-decoration:none;font-size:13.5px;font-weight:700}']
            ],
            'legal-knowledge/legal-mind/style.css': [
              ['.site-footer[data-footer-standard="v2"]{padding:0 0 28px;background:#fff;color:#111111;text-align:center}', '.site-footer[data-footer-standard="v2"]{padding:0 0 36px;background:#fff;color:#111111;text-align:center}'],
              ['.footer-brand strong{display:block;color:var(--text);font-size:13px;font-weight:650}', '.footer-brand strong{display:block;color:var(--text);font-size:15px;font-weight:700;line-height:1.5}'],
              ['.footer-brand p{margin:4px 0 0;font-size:13px}', '.footer-brand p{margin:5px 0 0;color:#111111;font-size:13.5px;line-height:1.72}'],
              ['.footer-meta{margin:9px auto 0;padding-top:9px;border-top:1px solid var(--line-soft)}', '.footer-meta{margin:14px auto 0;padding-top:14px;border-top:1px solid var(--line-soft);text-align:center}'],
              ['.footer-meta p{margin:0;color:#111111;font-size:13px;line-height:1.7}', '.footer-meta p{margin:0;color:#111111;font-size:14px;line-height:1.75;text-align:center}'],
              ['.footer-meta .business-meta{color:var(--text);font-weight:650}', '.footer-meta .business-meta{color:var(--text);font-weight:700}'],
              ['.footer-meta .ai-disclosure{max-width:920px;margin:6px auto 0;font-size:13px}', '.footer-meta .ai-disclosure{max-width:920px;margin:7px auto 0;font-size:13.5px;line-height:1.75}'],
              ['.footer-meta a{display:inline-block;margin-top:6px;color:var(--accent);font-size:13px;font-weight:650;text-decoration:none}', '.footer-meta p a{color:var(--accent);font-size:14px;font-weight:700;text-decoration:none}.footer-meta>a{display:inline-block;margin-top:7px;color:var(--accent);font-size:13.5px;font-weight:700;text-decoration:none}']
            ]
          };

          for (const [file, replacements] of Object.entries(files)) {
            let css = fs.readFileSync(file, 'utf8');
            const start = css.indexOf('.site-footer[data-footer-standard="v2"]');
            if (start < 0) throw new Error(`${file}: footer block not found`);
            const media = css.indexOf('\n@media', start);
            const end = media >= 0 ? media : css.length;
            let footer = css.slice(start, end);
            for (const [from, to] of replacements) {
              if (!footer.includes(from)) throw new Error(`${file}: expected footer source not found: ${from}`);
              footer = footer.replace(from, to);
            }
            css = css.slice(0, start) + footer + css.slice(end);
            fs.writeFileSync(file, css, 'utf8');
            console.log(`patched ${file}`);
          }
          NODE
      - name: Verify only the three CSS files changed
        run: |
          git diff --check
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "legal-knowledge/ai-literature/styles.css legal-knowledge/legal-mind/style.css legal-knowledge/project-standard.css "
      - name: Commit exact CSS replacements and remove this one-shot workflow
        run: |
          rm .github/workflows/footer-css-one-shot.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add legal-knowledge/project-standard.css legal-knowledge/ai-literature/styles.css legal-knowledge/legal-mind/style.css .github/workflows/footer-css-one-shot.yml
          git commit -m "align remaining legal knowledge footer css to nexus main"
          git push origin HEAD:fix/nexus-footer-main-standard-20260906
