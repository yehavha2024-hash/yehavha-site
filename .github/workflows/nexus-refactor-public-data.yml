name: NEXUS Refactor Public Data Consumers

on:
  push:

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace page-owned API transforms
        run: python scripts/nexus_refactor_public_data.py
      - name: Commit refactor
        run: |
          git config user.name 'NEXUS Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add nexus/intelligence-briefing/index.html nexus/investment-strategy/index.html
          if git diff --cached --quiet; then
            echo 'No refactor changes needed.'
            exit 0
          fi
          git commit -m 'Refactor page public data transforms into shared layer'
          git push origin HEAD:main
