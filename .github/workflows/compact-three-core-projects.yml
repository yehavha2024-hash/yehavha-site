name: Compact Three Core Projects
on:
  push:
    paths:
      - '.github/workflows/compact-three-core-projects.yml'
permissions:
  contents: write
jobs:
  compact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Finalize canonical readability
        run: node scripts/finalize-three-density.mjs
      - name: Commit canonical CSS changes
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add legal-knowledge/legal-mind/style.css toeic-human-100/project-standard.css
          git commit -m "Finalize Legal Mind and TOEIC readability"
          git push
