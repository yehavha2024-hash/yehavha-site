name: Refresh Nexus investment strategy

on:
  push:
    branches: [main]
    paths:
      - 'scripts/refresh-investment-strategy.mjs'
      - '.github/workflows/refresh-investment-strategy.yml'
  schedule:
    # GitHub Actions cron uses UTC. 11:30 UTC = 20:30 KST.
    - cron: '30 11 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nexus-investment-strategy-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Validate investment refresh script
        run: node --check scripts/refresh-investment-strategy.mjs

      - name: Refresh existing investment strategy content
        if: github.event_name != 'push'
        run: node scripts/refresh-investment-strategy.mjs

      - name: Commit refreshed investment strategy when changed
        if: github.event_name != 'push'
        shell: bash
        run: |
          if git diff --quiet -- nexus/investment-strategy/index.html; then
            echo "Investment strategy is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nexus/investment-strategy/index.html
          git commit -m "Refresh Nexus investment strategy"
          git push
