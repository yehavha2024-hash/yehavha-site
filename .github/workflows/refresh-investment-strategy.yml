name: Validate Nexus investment strategy refresh

on:
  push:
    branches: [main]
    paths:
      - 'scripts/refresh-investment-strategy.mjs'
      - 'scripts/report-airtable-status.mjs'
      - '.github/workflows/refresh-investment-strategy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexus-investment-strategy-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Validate investment refresh scripts
        run: |
          node --check scripts/refresh-investment-strategy.mjs
          node --check scripts/report-airtable-status.mjs

      - name: Confirm canonical investment page exists
        run: test -f nexus/investment-strategy/index.html
