name: Nexus Footer Audit Report

on:
  push:
    paths:
      - 'scripts/audit-nexus-footer-standard.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Capture footer audit
        run: |
          set +e
          node scripts/audit-nexus-footer-standard.mjs > nexus/footer-audit-report.txt 2>&1
          code=$?
          echo "AUDIT_EXIT_CODE=$code" >> nexus/footer-audit-report.txt
          exit 0
      - name: Commit audit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nexus/footer-audit-report.txt
          git commit -m "Record Nexus footer audit report" || exit 0
          git push
