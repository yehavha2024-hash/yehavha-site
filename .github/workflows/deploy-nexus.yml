name: Deploy NEXUS

on:
  push:
    branches: [main]
    paths:
      - "nexus/**"
      - ".github/workflows/deploy-nexus.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-nexus-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy yehavha-nexus-hub
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Validate NEXUS architecture ownership
        run: node nexus/scripts/audit-portal-enhancements.mjs

      - name: Validate NEXUS fixed-slot ownership
        shell: bash
        run: |
          set -euo pipefail

          # Main BIFF slot: exactly one static owner, no external BIFF logo/wordmark.
          test "$(grep -c 'id="homeBiffSpecial"' nexus/index.html)" -eq 1
          test "$(grep -c 'data-fixed-slot="biff-special"' nexus/index.html)" -eq 1
          if grep -Eq 'home-biff-logo|biff\.kr' nexus/index.html; then
            echo "::error::Legacy/external BIFF logo markup returned to nexus/index.html"
            exit 1
          fi

          # Main BIFF presentation belongs only to nexus-standard.css.
          if grep -q '\.home-biff-special-banner{' nexus/portal-v2.css; then
            echo "::error::BIFF main styles duplicated into portal-v2.css"
            exit 1
          fi
          grep -q '\.home-biff-special-banner{' nexus/nexus-standard.css

          # Runtime code must not rewrite the fixed BIFF slot.
          if grep -Eq 'homeBiffSpecial|home-biff-' nexus/portal-v2.js; then
            echo "::error::portal-v2.js must not mutate the fixed BIFF slot"
            exit 1
          fi

          # Interview feature belongs to YEHAVHA NEWS only.
          if grep -Eq 'homeInterviewFeature|newsInterviewFeature' nexus/index.html; then
            echo "::error::Interview feature returned to NEXUS main"
            exit 1
          fi
          test "$(grep -c 'id="newsInterviewFeature"' nexus/news/index.html)" -eq 1
          test "$(grep -c 'data-fixed-slot="interview-feature"' nexus/news/index.html)" -eq 1

          echo "NEXUS fixed-slot ownership validated."

      - name: Cloudflare credential status
        id: credentials
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Cloudflare direct deployment credentials are configured."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Direct NEXUS deployment is prepared but repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are not configured yet."
          fi

      - name: Deploy NEXUS to Cloudflare Pages
        if: steps.credentials.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy nexus --project-name=yehavha-nexus-hub --branch=main --commit-dirty=true

      - name: Verify production reflects current NEXUS main
        if: steps.credentials.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..18}; do
            html="$(curl -fsSL --max-time 15 "https://yehavha.com/?deploy_check=${GITHUB_SHA}" || true)"
            if printf '%s' "$html" | grep -q 'id="homeBiffSpecial"' \
              && ! printf '%s' "$html" | grep -q 'home-biff-logo' \
              && ! printf '%s' "$html" | grep -q 'biff.kr'; then
              echo "Production NEXUS matches current main."
              exit 0
            fi
            echo "Waiting for production propagation... (${attempt}/18)"
            sleep 10
          done
          echo "::error::Production yehavha.com did not reflect current NEXUS main within 3 minutes."
          exit 1
