name: Deploy NEXUS

on:
  push:
    branches: [main]
    paths:
      - "nexus/**"
      - ".github/workflows/deploy-nexus.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-nexus-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy yehavha-nexus-hub
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate NEXUS main BIFF banner source
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'id="homeBiffSpecial"' nexus/index.html
          grep -q 'data-fixed-slot="biff-special"' nexus/index.html
          if grep -q 'home-biff-logo' nexus/index.html; then
            echo "::error::Legacy BIFF logo markup returned to nexus/index.html"
            exit 1
          fi
          if grep -q 'biff.kr' nexus/index.html; then
            echo "::error::External BIFF image dependency returned to NEXUS main"
            exit 1
          fi

      - name: Verify Cloudflare deployment credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN repository secret"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID repository secret"; exit 1; }

      - name: Deploy NEXUS to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy nexus --project-name=yehavha-nexus-hub --branch=main --commit-dirty=true

      - name: Verify production reflects current NEXUS main
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..18}; do
            html="$(curl -fsSL --max-time 15 "https://yehavha.com/?deploy_check=${GITHUB_SHA}" || true)"
            if printf '%s' "$html" | grep -q 'id="homeBiffSpecial"' \
              && ! printf '%s' "$html" | grep -q 'home-biff-logo' \
              && ! printf '%s' "$html" | grep -q 'biff.kr'; then
              echo "Production NEXUS matches the compact image-free BIFF banner source."
              exit 0
            fi
            echo "Waiting for production propagation... (${attempt}/18)"
            sleep 10
          done
          echo "::error::Production yehavha.com did not reflect the current NEXUS main within 3 minutes."
          exit 1
