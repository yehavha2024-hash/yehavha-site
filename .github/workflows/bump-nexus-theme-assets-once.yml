name: Bump Nexus theme asset versions once

on:
  push:
    paths:
      - '.github/workflows/bump-nexus-theme-assets-once.yml'

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Bump visual standard asset versions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          changes = {
              'legal-knowledge/index.html': [
                  ('project-standard.css?v=20260809-2026', 'project-standard.css?v=20260809-2135'),
              ],
              'ai-law-tech-foresight/index.html': [
                  ('project-standard.css?v=20260809-2026', 'project-standard.css?v=20260809-2135'),
              ],
              'legal-philosophy/index.html': [
                  ('doctoral-citation-pack-7.css?v=20260809-0426', 'doctoral-citation-pack-7.css?v=20260809-2135'),
                  ('doctoral-citation-pack-7-ui.js?v=20260809-1153', 'doctoral-citation-pack-7-ui.js?v=20260809-2135'),
              ],
              'three-minute-break/index.html': [
                  ('nexus-shell.css?v=20260809-2026', 'nexus-shell.css?v=20260809-2135'),
              ],
              'toeic-human-100/index.html': [
                  ('nexus-shell.css?v=20260809-v6', 'nexus-shell.css?v=20260809-2135'),
              ],
          }
          for filename, replacements in changes.items():
              p = Path(filename)
              text = p.read_text(encoding='utf-8')
              for old, new in replacements:
                  text = text.replace(old, new)
              p.write_text(text, encoding='utf-8')
          PY
      - name: Commit version bumps
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add legal-knowledge/index.html ai-law-tech-foresight/index.html legal-philosophy/index.html three-minute-break/index.html toeic-human-100/index.html
          if git diff --cached --quiet; then
            echo "No version changes needed"
            exit 0
          fi
          git commit -m "Refresh Nexus visual standard assets"
          git push origin main
