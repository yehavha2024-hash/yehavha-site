name: NEXUS Attach EdTech Education Data

on:
  push:

permissions:
  contents: write

jobs:
  attach:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Attach shared education data renderer
        run: python -c "from pathlib import Path; p=Path('nexus/edtech-research/index.html'); s=p.read_text(encoding='utf-8'); marker='<script src=\"../shared/education-data-render.js?v=20260907\"></script>'; p.write_text(s if marker in s else s.replace('</body>', marker+'\\n</body>'), encoding='utf-8')"
      - name: Commit direct source update and remove one-shot workflow
        run: |
          git config user.name 'NEXUS Automation'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/nexus-attach-edtech-data.yml
          git add nexus/edtech-research/index.html
          git commit -m 'Connect EdTech to shared education intelligence'
          git push origin HEAD:main
