name: Normalize YEHAVHA NEWS article shell

on:
  push:
    branches: [main]
    paths:
      - 'nexus/news/articles/**'
      - 'nexus/news/news-data.js'
      - 'nexus/scripts/normalize-news-articles.mjs'
      - 'nexus/scripts/sync-news-registry.mjs'
      - 'scripts/ci/safe-content-commit.sh'
      - '.github/workflows/normalize-news-articles.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: yehavha-news-shell-normalize
  cancel-in-progress: true

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Normalize article shell
        run: node nexus/scripts/normalize-news-articles.mjs

      - name: Synchronize article registry
        run: node nexus/scripts/sync-news-registry.mjs

      - name: Publish article-owned repairs when needed
        shell: bash
        run: bash scripts/ci/safe-content-commit.sh "Normalize YEHAVHA NEWS article outputs" nexus/news/articles nexus/news/news-data.js
