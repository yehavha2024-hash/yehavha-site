name: Reconcile and gate YEHAVHA NEWS articles

on:
  push:
    branches: [main]
    paths:
      - 'nexus/news/articles/**'
      - 'nexus/news/news-data.js'
      - 'nexus/news/sitemap.xml'
      - 'nexus/scripts/normalize-news-articles.mjs'
      - 'nexus/scripts/sync-news-registry.mjs'
      - 'nexus/scripts/audit-news-architecture.mjs'
      - 'nexus/scripts/audit-news-quality.mjs'
      - 'scripts/ci/safe-content-commit.sh'
      - '.github/workflows/normalize-news-articles.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: yehavha-news-reconcile-main
  cancel-in-progress: true

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Normalize article shell
        run: node nexus/scripts/normalize-news-articles.mjs

      - name: Synchronize article registry and sitemap
        run: node nexus/scripts/sync-news-registry.mjs

      - name: Verify reconciliation is idempotent
        shell: bash
        run: |
          git diff --binary -- nexus/news/articles nexus/news/news-data.js nexus/news/sitemap.xml > /tmp/news-first.patch
          node nexus/scripts/normalize-news-articles.mjs
          node nexus/scripts/sync-news-registry.mjs
          git diff --binary -- nexus/news/articles nexus/news/news-data.js nexus/news/sitemap.xml > /tmp/news-second.patch
          if ! cmp -s /tmp/news-first.patch /tmp/news-second.patch; then
            echo 'YEHAVHA NEWS reconciliation is not idempotent; refusing to publish.' >&2
            diff -u /tmp/news-first.patch /tmp/news-second.patch || true
            exit 1
          fi

      - name: Validate final NEWS architecture
        run: node nexus/scripts/audit-news-architecture.mjs

      - name: Validate final article quality
        run: node nexus/scripts/audit-news-quality.mjs

      - name: Publish validated article-owned outputs when needed
        shell: bash
        run: bash scripts/ci/safe-content-commit.sh "Reconcile validated YEHAVHA NEWS outputs" nexus/news/articles nexus/news/news-data.js nexus/news/sitemap.xml
