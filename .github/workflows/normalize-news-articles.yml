name: Validate YEHAVHA NEWS article shell

on:
  push:
    branches: [main]
    paths:
      - 'nexus/news/articles/**'
      - 'nexus/scripts/normalize-news-articles.mjs'
      - '.github/workflows/normalize-news-articles.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yehavha-news-shell-normalize
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Validate normalized article shell
        shell: bash
        run: |
          node nexus/scripts/normalize-news-articles.mjs
          if ! git diff --quiet -- nexus/news/articles; then
            echo "YEHAVHA NEWS article shell normalization is required."
            git diff -- nexus/news/articles
            exit 1
          fi
          echo "YEHAVHA NEWS article shells are normalized."
