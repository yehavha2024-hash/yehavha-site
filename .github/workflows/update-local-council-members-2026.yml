name: Update 2026 local council members

on:
  push:
    branches: [main]
    paths:
      - 'scripts/update-local-council-members-2026.py'
      - 'scripts/install-local-council-ui.py'
      - 'nexus/local-government-planning/council-render.js'
      - '.github/workflows/update-local-council-members-2026.yml'
  schedule:
    - cron: '20 18 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nexus-local-council-members-2026
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install parser dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Probe official NEC council winner codes
        shell: bash
        run: |
          python - <<'PY'
          import requests
          from bs4 import BeautifulSoup
          base='https://info.nec.go.kr/electioninfo/electionInfo_report.xhtml'
          common={
            'electionId':'0000000000','requestURI':'/WEB-INF/jsp/electioninfo/0000000000/ep/epei01.jsp',
            'topMenuId':'EP','secondMenuId':'EPEI01','menuId':'EPEI01','statementId':'EPEI01_#1',
            'oldElectionType':'1','electionType':'4','electionName':'20260603','cityCode':'1100',
            'proportionalRepresentationCode':'-1','townCode':'-1'
          }
          s=requests.Session(); s.headers['User-Agent']='Mozilla/5.0'
          for code in range(3,11):
            p=common|{'electionCode':str(code)}
            r=s.get(base,params=p,timeout=30)
            soup=BeautifulSoup(r.text,'html.parser')
            table=soup.select_one('#table01')
            text=' '.join(table.stripped_strings)[:900] if table else 'NO TABLE'
            print('CODE',code,'HTTP',r.status_code,'LEN',len(r.text),'TABLE',bool(table))
            print(text)
          PY
