name: Update 2026 local council members

on:
  push:
    branches: [main]
    paths:
      - 'scripts/update-local-council-members-2026.py'
      - 'scripts/install-local-council-ui.py'
      - 'nexus/local-government-planning/council-render.js'
      - '.github/workflows/update-local-council-members-2026.yml'
  schedule:
    - cron: '20 18 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nexus-local-council-members-2026
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install parser dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Install council UI hooks
        run: python scripts/install-local-council-ui.py

      - name: Inspect public council data fields
        shell: bash
        run: |
          curl -fLsS --max-time 60 'https://r.jina.ai/https://cpmadang.org/people/list_of_candidates_2026/winner' > /tmp/council.md
          grep -nE '당선인|선거구|시·도의회의원선거|구·시·군의회의원선거|광역의원비례대표|기초의원비례대표|더불어민주당|국민의힘|조국혁신당|진보당|무소속' /tmp/council.md | head -n 240 || true

      - name: Hold generation until parser update
        run: echo 'Text feed inspected; parser update follows.'
