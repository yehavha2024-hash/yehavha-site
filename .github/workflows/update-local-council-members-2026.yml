name: Update 2026 local council members

on:
  push:
    branches: [main]
    paths:
      - 'scripts/update-local-council-members-2026.py'
      - 'scripts/install-local-council-ui.py'
      - 'nexus/local-government-planning/council-render.js'
      - '.github/workflows/update-local-council-members-2026.yml'
  schedule:
    - cron: '20 18 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nexus-local-council-members-2026
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install parser dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Install council UI hooks
        run: python scripts/install-local-council-ui.py

      - name: Build elected council member database
        run: python scripts/update-local-council-members-2026.py

      - name: Commit councillor database when changed
        shell: bash
        run: |
          if git diff --quiet -- nexus/local-government-planning/index.html nexus/local-government-planning/council-members-2026.js; then
            echo "Council member database is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nexus/local-government-planning/index.html nexus/local-government-planning/council-members-2026.js
          git commit -m "Update 2026 local council member database"
          git push
