name: Footer Audit Sync

on:
  push:
    paths:
      - 'scripts/fix-audit-findings.mjs'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: node scripts/fix-audit-findings.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/audit-business-footer.mjs scripts/audit-style-ownership.mjs scripts/audit-web-architecture.mjs toeic-human-100/reading-v2.css
          git commit -m "Resolve footer audit blind spots" || exit 0
          git push
