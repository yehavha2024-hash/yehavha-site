name: One-time YEHAVHA NEWS timestamp migration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/migrate-news-timestamps.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: yehavha-news-timestamp-migration
  cancel-in-progress: true

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Stamp written and modified times
        run: node nexus/scripts/stamp-news-article-times.mjs

      - name: Normalize article shell
        run: node nexus/scripts/normalize-news-articles.mjs

      - name: Synchronize registry and sitemap
        run: node nexus/scripts/sync-news-registry.mjs

      - name: Validate NEWS architecture
        run: node nexus/scripts/audit-news-architecture.mjs

      - name: Validate article quality
        run: node nexus/scripts/audit-news-quality.mjs

      - name: Publish timestamp migration
        shell: bash
        run: bash scripts/ci/safe-content-commit.sh "Apply NEWS article written and modified timestamps" nexus/news/articles nexus/news/news-data.js nexus/news/sitemap.xml
