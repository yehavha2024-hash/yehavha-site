name: TOEIC Reading V2 Validate

on:
  push:
    paths:
      - 'toeic-human-100/**'
      - '.github/workflows/toeic-reading-v2-validate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check V2 runtime syntax
        run: node --check toeic-human-100/app-v2.js

      - name: Check V2 extension syntax
        run: |
          node --check toeic-human-100/reading-content-v2.js
          node --check toeic-human-100/reading-content-v2-days02-04.js
          node --check toeic-human-100/reading-content-v2-days05-07.js
          node --check toeic-human-100/reading-content-v2-days08-10.js
          node --check toeic-human-100/reading-content-v2-length-patch.js
          node --check toeic-human-100/teps-extension-v2.js
          node --check toeic-human-100/teps-extension-length-patch.js
          node --check toeic-human-100/teps-extension-ui-v2.js

      - name: Check validators and planner
        run: |
          node --check toeic-human-100/scripts/validate-reading-v2.mjs
          node --check toeic-human-100/scripts/validate-reading-v2-expanded.mjs
          node --check toeic-human-100/scripts/audit-reading-coverage-v2.mjs
          node --check toeic-human-100/scripts/plan-coverage-correction-v2.mjs

      - name: Run original staged validation
        run: node toeic-human-100/scripts/validate-reading-v2.mjs

      - name: Run expanded TOEIC and TEPS validation
        run: node toeic-human-100/scripts/validate-reading-v2-expanded.mjs

      - name: Run master lexicon coverage audit
        if: always()
        run: node toeic-human-100/scripts/audit-reading-coverage-v2.mjs

      - name: Plan next 10-day coverage correction
        if: always()
        run: node toeic-human-100/scripts/plan-coverage-correction-v2.mjs

      - name: Upload validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: toeic-reading-v2-validation
          if-no-files-found: warn
          path: |
            toeic-human-100/READING_V2_EXPANDED_VALIDATION.json
            toeic-human-100/READING_V2_COVERAGE.json
            toeic-human-100/READING_V2_COVERAGE.md
            toeic-human-100/NEXT_10_DAY_TARGETS.json
            toeic-human-100/NEXT_10_DAY_TARGETS.md
            toeic-human-100/coverage-policy-v2.json
