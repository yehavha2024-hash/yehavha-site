name: Nexus Light Theme Migration

on:
  push:
    paths:
      - 'scripts/migrate-nexus-light-theme.mjs'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Rewrite canonical Nexus sources to light theme
        run: node scripts/migrate-nexus-light-theme.mjs
      - name: Commit canonical light theme
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nexus NEXUS_UI_STANDARD.md scripts/audit-nexus-light-theme.mjs
          if git diff --cached --quiet; then
            echo "No light-theme migration changes."
            exit 0
          fi
          git commit -m "Convert Nexus canonical UI to white theme"
          git push
