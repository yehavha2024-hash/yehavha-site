name: TOEIC Master Lexicon Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'toeic-human-100/scripts/build-master-lexicon-v2.mjs'
      - 'toeic-human-100/MASTER_CORPUS_SOURCES.md'
      - '.github/workflows/toeic-master-lexicon-build.yml'

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check builder syntax
        run: node --check toeic-human-100/scripts/build-master-lexicon-v2.mjs

      - name: Build master lexicon
        run: node toeic-human-100/scripts/build-master-lexicon-v2.mjs

      - name: Commit generated master lexicon when changed
        run: |
          if git diff --quiet -- toeic-human-100/master-lexicon-v2.json && git ls-files --error-unmatch toeic-human-100/master-lexicon-v2.json >/dev/null 2>&1; then
            echo "Master lexicon unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add toeic-human-100/master-lexicon-v2.json
          git commit -m "Update TOEIC master lexicon v2"
          git push
