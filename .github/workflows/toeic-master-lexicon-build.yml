name: TOEIC Master Lexicon Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'toeic-human-100/scripts/build-master-lexicon-v2.mjs'
      - 'toeic-human-100/MASTER_CORPUS_SOURCES.md'
      - '.github/workflows/toeic-master-lexicon-build.yml'

permissions:
  contents: write

concurrency:
  group: yehavha-main-content-writer
  cancel-in-progress: false
  queue: max

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Check builder syntax
        run: node --check toeic-human-100/scripts/build-master-lexicon-v2.mjs

      - name: Build master lexicon
        run: node toeic-human-100/scripts/build-master-lexicon-v2.mjs

      - name: Commit generated master lexicon when changed
        shell: bash
        run: bash scripts/ci/safe-content-commit.sh "Update TOEIC master lexicon v2" toeic-human-100/master-lexicon-v2.json
