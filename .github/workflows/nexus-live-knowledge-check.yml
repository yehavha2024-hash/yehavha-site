name: NEXUS Live Knowledge Check

on:
  push:

permissions:
  contents: write

jobs:
  check:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe production knowledge pipeline
        shell: bash
        run: |
          set +e
          BASE='https://yehavha.com'
          echo '=== CATALOG ==='
          catalog_code=$(curl -sS -L -o /tmp/catalog.json -w '%{http_code}' "$BASE/api/public-data?source=catalog")
          echo "HTTP $catalog_code"
          python - <<'PY'
          import json
          try:
              d=json.load(open('/tmp/catalog.json',encoding='utf-8'))
              print('catalog_ok=', d.get('ok'))
              print('knowledge_store=', d.get('knowledgeStore'))
              print('source_count=', len(d.get('sources') or []))
          except Exception as e:
              print('catalog_parse_error=', type(e).__name__)
          PY

          echo '=== KNOWLEDGE BEFORE ==='
          knowledge_code=$(curl -sS -L -o /tmp/knowledge-before.json -w '%{http_code}' "$BASE/api/nexus-knowledge?axis=legal&limit=12")
          echo "HTTP $knowledge_code"
          python - <<'PY'
          import json
          try:
              d=json.load(open('/tmp/knowledge-before.json',encoding='utf-8'))
              print('knowledge_ok=', d.get('ok'))
              print('knowledge_error=', d.get('error'))
              print('binding=', d.get('binding'))
              print('stored_sources=', d.get('stored_sources'))
              axes=d.get('axes') or []
              if axes:
                  print('legal_sources=', axes[0].get('sources'))
                  print('changed_sources=', axes[0].get('changed_sources'))
                  print('priority=', axes[0].get('priority'))
          except Exception as e:
              print('knowledge_parse_error=', type(e).__name__)
          PY

          if [ "$knowledge_code" = '200' ]; then
            stamp=$(date -u +%Y%m%d%H%M%S)
            echo '=== INITIAL SNAPSHOT TRIGGER ==='
            snapshot_code=$(curl -sS -L -o /tmp/snapshot.json -w '%{http_code}' "$BASE/api/public-data?source=law-current&display=20&_snapshot=$stamp")
            echo "HTTP $snapshot_code"
            python - <<'PY'
          import json
          try:
              d=json.load(open('/tmp/snapshot.json',encoding='utf-8'))
              print('snapshot_ok=', d.get('ok'))
              print('source=', d.get('source'))
              print('record_count=', len(d.get('records') or []))
              print('knowledge=', d.get('knowledge'))
          except Exception as e:
              print('snapshot_parse_error=', type(e).__name__)
          PY
            echo '=== KNOWLEDGE AFTER ==='
            curl -sS -L "$BASE/api/nexus-knowledge?axis=legal&limit=12" -o /tmp/knowledge-after.json
            python - <<'PY'
          import json
          try:
              d=json.load(open('/tmp/knowledge-after.json',encoding='utf-8'))
              print('knowledge_ok=', d.get('ok'))
              print('stored_sources=', d.get('stored_sources'))
              axes=d.get('axes') or []
              if axes:
                  print('legal_sources=', axes[0].get('sources'))
                  print('changed_sources=', axes[0].get('changed_sources'))
                  print('executive=', axes[0].get('executive'))
          except Exception as e:
              print('knowledge_after_parse_error=', type(e).__name__)
          PY
          fi
      - name: Remove diagnostic workflow
        run: |
          git config user.name 'NEXUS Automation'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/nexus-live-knowledge-check.yml
          git commit -m 'Remove Nexus live knowledge diagnostic'
          git push origin HEAD:main
