name: Archive Intelligence Briefing

on:
  push:
    branches:
      - main
    paths:
      - nexus/intelligence-briefing/latest.json
      - scripts/archive-intelligence-briefing.mjs
      - scripts/ci/safe-content-commit.sh
      - .github/workflows/intelligence-briefing-archive.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: intelligence-briefing-archive
  cancel-in-progress: true

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Archive latest briefing
        run: node scripts/archive-intelligence-briefing.mjs

      - name: Publish immutable archive snapshot
        shell: bash
        run: bash scripts/ci/safe-content-commit.sh "Archive intelligence briefing snapshot" nexus/intelligence-briefing/archive nexus/intelligence-briefing/archive-index.json
