name: Archive Intelligence Briefing

on:
  push:
    branches:
      - main
    paths:
      - nexus/intelligence-briefing/latest.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Archive latest briefing
        run: node scripts/archive-intelligence-briefing.mjs

      - name: Commit immutable archive snapshot
        shell: bash
        run: |
          if git diff --quiet -- nexus/intelligence-briefing/archive nexus/intelligence-briefing/archive-index.json; then
            echo "No archive changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- nexus/intelligence-briefing/archive nexus/intelligence-briefing/archive-index.json
          git commit -m "Archive intelligence briefing snapshot"
          git push
