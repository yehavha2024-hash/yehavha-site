name: Normalize project footers

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/normalize-project-footers.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Normalize footer and contact metadata
        shell: python
        run: |
          from pathlib import Path

          mail='kimbrighth@gmail.com'
          copyright_text='Copyright © 이명훈 2026. All rights reserved.'

          legal=Path('legal-knowledge/index.html')
          s=legal.read_text(encoding='utf-8')
          old='<footer><div>Copyright © 이명훈 2026. All rights reserved.</div><div class="footer-note">Research archive · Updated by verified topic units</div></footer>'
          new=f'<footer><div>{copyright_text}</div><div class="footer-note">문의 <a href="mailto:{mail}">{mail}</a></div></footer>'
          if old in s:
              s=s.replace(old,new,1)
          elif mail not in s:
              s=s.replace('</footer>',f'<div class="footer-note">문의 <a href="mailto:{mail}">{mail}</a></div></footer>',1)
          legal.write_text(s,encoding='utf-8')

          root=Path('index.html')
          s=root.read_text(encoding='utf-8')
          s=s.replace('contact@ailawri.org',mail)
          old_footer='<footer><a class="brand" href="#top"><span class="brand-mark">AIL</span><span><strong>AI 법률연구소</strong><small>AI LAW RESEARCH INSTITUTE</small></span></a><p>AI의 행위와 책임, 그리고 법의 미래를 연구합니다.</p><div><span>© <span id="year">2026</span> AI LAW RESEARCH INSTITUTE</span><a href="#top">BACK TO TOP ↑</a></div></footer>'
          new_footer=f'<footer><a class="brand" href="#top"><span class="brand-mark">AIL</span><span><strong>AI 법률연구소</strong><small>AI LAW RESEARCH INSTITUTE</small></span></a><p>AI의 행위와 책임, 그리고 법의 미래를 연구합니다.</p><div><span>{copyright_text}</span><span>문의 <a href="mailto:{mail}">{mail}</a></span><a href="#top">BACK TO TOP ↑</a></div></footer>'
          if old_footer in s:
              s=s.replace(old_footer,new_footer,1)
          root.write_text(s,encoding='utf-8')
      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add legal-knowledge/index.html index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Standardize copyright and contact information"
          git pull --rebase origin main
          git push origin HEAD:main
