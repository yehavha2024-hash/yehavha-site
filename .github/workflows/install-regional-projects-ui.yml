name: Install regional project DB UI

on:
  push:
    branches: [main]
    paths:
      - 'scripts/install-regional-projects-ui.py'
      - 'nexus/local-government-planning/regional-projects-2027.js'
      - 'nexus/local-government-planning/regional-projects-render.js'
      - '.github/workflows/install-regional-projects-ui.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install regional project UI
        run: python scripts/install-regional-projects-ui.py
      - name: Commit index change
        shell: bash
        run: |
          if git diff --quiet -- nexus/local-government-planning/index.html; then
            echo 'Already installed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nexus/local-government-planning/index.html
          git commit -m 'Connect regional project database to Nexus manual'
          git push
