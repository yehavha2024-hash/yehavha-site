name: Refresh Legal Intelligence legislation tracker

on:
  push:
    branches: [main]
    paths:
      - 'nexus/legal-intelligence/collector-config.json'
      - 'nexus/legal-intelligence/scripts/**'
      - '.github/workflows/refresh-legal-intelligence.yml'
  schedule:
    - cron: '20 0 * * 1-5'
    - cron: '20 9 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: legal-intelligence-legislation-refresh
  cancel-in-progress: true

env:
  OPEN_ASSEMBLY_API_KEY: ${{ secrets.OPEN_ASSEMBLY_API_KEY }}
  LAWMAKING_OC: ${{ secrets.LAWMAKING_OC }}

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Syntax and canonical data audit
        run: |
          node --check nexus/legal-intelligence/scripts/collect-legislation.mjs
          node --check nexus/legal-intelligence/scripts/select-legislation.mjs
          node --check nexus/legal-intelligence/scripts/upsert-legislation.mjs
          node --check nexus/legal-intelligence/scripts/audit-legislation.mjs
          node nexus/legal-intelligence/scripts/audit-legislation.mjs

      - name: Report source modes
        shell: bash
        run: |
          if [ -z "$OPEN_ASSEMBLY_API_KEY" ]; then
            echo "### 국회 입법 API 비활성" >> "$GITHUB_STEP_SUMMARY"
            echo "OPEN_ASSEMBLY_API_KEY 미등록: 기존 국회 레코드는 보존하고 국회 신규 수집·상태조회만 건너뜁니다." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### 국회 입법 API 활성" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -z "$LAWMAKING_OC" ]; then
            echo "### 정부입법 공개목록 모드" >> "$GITHUB_STEP_SUMMARY"
            echo "LAWMAKING_OC 미등록: 국민참여입법센터 공개 정부입법현황에서 lbicId·법령명·부처·추진단계를 수집합니다." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### 정부입법 OC API 우선 모드" >> "$GITHUB_STEP_SUMMARY"
            echo "OC API 실패 시 공개목록 모드로 자동 전환합니다." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Collect official legislation candidates
        run: node nexus/legal-intelligence/scripts/collect-legislation.mjs /tmp/legal-collected.json

      - name: Select Nexus-relevant legislation
        run: node nexus/legal-intelligence/scripts/select-legislation.mjs /tmp/legal-collected.json /tmp/legal-selected.json

      - name: Validate selected records
        run: node nexus/legal-intelligence/scripts/audit-legislation.mjs /tmp/legal-selected.json

      - name: Upsert canonical legislation records
        run: node nexus/legal-intelligence/scripts/upsert-legislation.mjs /tmp/legal-selected.json

      - name: Validate canonical result
        run: node nexus/legal-intelligence/scripts/audit-legislation.mjs

      - name: Commit legislation data when changed
        shell: bash
        run: |
          if git diff --quiet -- nexus/legal-intelligence/legislation.json; then
            echo "No legislation changes detected."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nexus/legal-intelligence/legislation.json
          git commit -m "Refresh Legal Intelligence legislation data"
          git pull --rebase origin main
          git push origin main
