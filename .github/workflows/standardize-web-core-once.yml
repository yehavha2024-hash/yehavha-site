name: Standardize core web architecture once

on:
  push:
    paths:
      - '.github/workflows/standardize-web-core-once.yml'

permissions:
  contents: write

jobs:
  standardize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Normalize core files
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          foresight = Path('ai-law-tech-foresight/app.js')
          text = foresight.read_text(encoding='utf-8')
          old = '''        <p>문의 <a href="mailto:kimbrighth@gmail.com">kimbrighth@gmail.com</a></p>
      </div>'''
          new = '''        <p>문의 <a href="mailto:kimbrighth@gmail.com">kimbrighth@gmail.com</a></p>
        <p class="ai-disclosure">AI 활용 안내: 일부 기술·법률 연구자료의 탐색·구조화·초안 작성에 생성형 AI를 활용했으며, 사실과 전망의 구분, 법적 분석, 출처 검토와 최종 편집은 운영자가 관리합니다.</p>
      </div>'''
          if old in text and 'documentFooter()' in text:
              text = text.replace(old, new, 1)
          foresight.write_text(text, encoding='utf-8')

          legal = Path('legal-philosophy/index.html')
          text = legal.read_text(encoding='utf-8')
          text = text.replace('<footer class="site-footer">', '<footer class="site-footer" data-footer-standard="v1">', 1)
          text = text.replace('app.js?v=20260809-0132', 'app.js?v=20260809-2026')
          legal.write_text(text, encoding='utf-8')
          PY
      - name: Run architecture audit
        run: node scripts/audit-web-architecture.mjs
      - name: Commit standardized core
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai-law-tech-foresight/app.js legal-philosophy/index.html
          git commit -m "Standardize core web footer ownership"
          git push
