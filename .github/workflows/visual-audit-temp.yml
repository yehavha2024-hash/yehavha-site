name: Temporary Visual Audit

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Capture public UI
        run: |
          mkdir -p visual-audit
          cat > /tmp/capture.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'fs';

          const pages = [
            ['nexus', 'https://yehavha-nexus-hub.pages.dev/'],
            ['research-track', 'https://yehavha-nexus-hub.pages.dev/research-track/'],
            ['ai-practice', 'https://yehavha-nexus-hub.pages.dev/ai-practice/'],
            ['initiatives', 'https://yehavha-nexus-hub.pages.dev/initiatives/'],
            ['articles', 'https://yehavha-nexus-hub.pages.dev/articles/'],
            ['publishing', 'https://yehavha-nexus-hub.pages.dev/publishing/'],
            ['toeic-v2', 'https://yehavha-nexus-hub.pages.dev/toeic-human-v2/'],
            ['legal-knowledge', 'https://yehavha-legal-knowledge.danielie.workers.dev/'],
            ['legal-philosophy', 'https://yehavha-legal-philosophy.pages.dev/'],
            ['ai-foresight', 'https://yehavha-ai-foresight-v2.pages.dev/']
          ];
          const views = [
            ['desktop', { width: 1440, height: 1000 }],
            ['mobile', { width: 390, height: 844 }]
          ];

          const browser = await chromium.launch();
          for (const [name, url] of pages) {
            for (const [viewName, viewport] of views) {
              const page = await browser.newPage({ viewportSize: viewport });
              try {
                await page.goto(url, { waitUntil: 'networkidle', timeout: 45000 });
                await page.screenshot({ path: `visual-audit/${name}-${viewName}.png`, fullPage: true });
                const info = await page.evaluate(() => ({
                  title: document.title,
                  bodyText: document.body.innerText,
                  viewportWidth: innerWidth,
                  scrollWidth: document.documentElement.scrollWidth,
                  scrollHeight: document.documentElement.scrollHeight
                }));
                fs.writeFileSync(`visual-audit/${name}-${viewName}.json`, JSON.stringify(info, null, 2));
              } catch (error) {
                fs.writeFileSync(`visual-audit/${name}-${viewName}.error.txt`, String(error));
              } finally {
                await page.close();
              }
            }
          }
          await browser.close();
          EOF
          node /tmp/capture.mjs
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: nexus-visual-audit
          path: visual-audit/
          if-no-files-found: error
          retention-days: 1
