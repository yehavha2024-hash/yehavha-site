name: Normalize large indexes once

on:
  push:
    paths:
      - '.github/workflows/normalize-large-indexes-once.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Normalize Nexus and legal knowledge
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          legal = Path('legal-knowledge/index.html')
          text = legal.read_text(encoding='utf-8')
          anchor = '<link rel="stylesheet" href="enhancements.css?v=20260809-2026" />'
          extra = anchor + '\n  <link rel="stylesheet" href="project-standard.css?v=20260809-2026" />'
          if 'project-standard.css' not in text:
              if anchor not in text:
                  raise SystemExit('Legal knowledge stylesheet anchor not found')
              text = text.replace(anchor, extra, 1)
          legal.write_text(text, encoding='utf-8')

          nexus = Path('nexus/index.html')
          text = nexus.read_text(encoding='utf-8')
          old = '<footer class="footer">\n<div class="container">\n<div class="footer-card">\n<strong>YEHAVHA Nexus</strong>\n<p>웹앱·연구·출판·미디어·교육 콘텐츠를 연결하는 통합 프로젝트 포털입니다.</p>\n<a href="#top">맨 위로 이동 ↑</a>\n<div aria-label="저작권 및 문의" class="footer-meta">\n<p class="copyright">Copyright © 이명훈 2026. All rights reserved.</p>\n<p class="contact">문의 <a href="mailto:kimbrighth@gmail.com">kimbrighth@gmail.com</a></p>\n</div>\n</div>\n</div>\n</footer>'
          new = '<footer class="footer" data-footer-standard="v1">\n<div class="container">\n<div class="footer-card">\n<strong>YEHAVHA Nexus</strong>\n<p>웹앱·연구·출판·미디어·교육 콘텐츠를 연결하는 통합 프로젝트 포털입니다.</p>\n<div aria-label="저작권 및 문의" class="footer-meta">\n<p class="copyright">Copyright © 이명훈 2026. All rights reserved.</p>\n<p class="contact">문의 <a href="mailto:kimbrighth@gmail.com">kimbrighth@gmail.com</a></p>\n<p class="ai-disclosure">AI 활용 안내: 일부 프로젝트의 콘텐츠·문안·연구자료 제작과 정리에 생성형 AI를 활용하며, 각 프로젝트의 기획·검토·편집·운영은 운영자가 관리합니다.</p>\n<a href="#top">맨 위로 이동 ↑</a>\n</div>\n</div>\n</div>\n</footer>'
          if 'data-footer-standard="v1"' not in text:
              if old not in text:
                  raise SystemExit('Nexus footer block not found')
              text = text.replace(old, new, 1)
          text = text.replace('./portal-v2.js?v=20260809-0108', './portal-v2.js?v=20260809-2026')
          nexus.write_text(text, encoding='utf-8')

          portal = Path('nexus/portal-v2.js')
          text = portal.read_text(encoding='utf-8')
          text, count = re.subn(r'\n  function ensureAiDisclosure\(\) \{.*?\n  \}\n\n', '\n', text, count=1, flags=re.S)
          if count == 0 and 'function ensureAiDisclosure' in text:
              raise SystemExit('Could not remove Nexus disclosure patch function')
          text = text.replace('\n  ensureAiDisclosure();\n  loadPortal();', '\n  loadPortal();')
          portal.write_text(text, encoding='utf-8')

          temp = Path('nexus/deploy-counter-version.txt')
          if temp.exists(): temp.unlink()
          PY
      - name: Commit normalized files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A nexus legal-knowledge/index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Standardize Nexus and legal knowledge ownership"
          git push
