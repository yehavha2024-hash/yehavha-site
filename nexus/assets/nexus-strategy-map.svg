<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">YEHAVHA NEXUS AI·AX 전략 시스템</title>
  <desc id="desc">지식에서 전략으로 전략에서 대응으로 이어지는 YEHAVHA NEXUS의 AI·AX 전략 네트워크.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#03101f"/>
      <stop offset=".38" stop-color="#072b52"/>
      <stop offset=".72" stop-color="#0c3860"/>
      <stop offset="1" stop-color="#08172d"/>
    </linearGradient>
    <radialGradient id="cyanGlow" cx="73%" cy="44%" r="58%">
      <stop offset="0" stop-color="#37c6ff" stop-opacity=".32"/>
      <stop offset=".48" stop-color="#1697e5" stop-opacity=".12"/>
      <stop offset="1" stop-color="#1697e5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violetGlow" cx="88%" cy="18%" r="42%">
      <stop offset="0" stop-color="#9d79ff" stop-opacity=".30"/>
      <stop offset="1" stop-color="#9d79ff" stop-opacity="0"/>
