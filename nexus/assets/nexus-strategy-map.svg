<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">YEHAVHA NEXUS 전략 시스템 구조도</title>
  <desc id="desc">지식에서 전략으로, 전략에서 대응으로. NEXUS UNIVERSITY, 정부 AX 전략·대응, 정보·전략, 연구·지식, 웹앱·서비스, 교육·강좌, 출판·아카이브, 미디어·콘텐츠, 아이디어 허브를 YEHAVHA NEXUS가 연결하는 구조도.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071426"/><stop offset="1" stop-color="#0b2440"/></linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2d73bf"/><stop offset="1" stop-color="#57b7d8"/></linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="460" rx="28" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="458" rx="27" fill="none" stroke="#2f5d87" stroke-opacity=".45"/>
  <g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', Arial, sans-serif" text-anchor="middle">
    <text x="600" y="34" fill="#9fcfff" font-size="15" font-weight="700" letter-spacing="2">AI · AX STRATEGIC SYSTEM</text>
    <text x="600" y="64" fill="#f2f7ff" font-size="24" font-weight="800">지식에서 전략으로, 전략에서 대응으로</text>
  </g>
  <g stroke="#5fa8e8" stroke-opacity=".38" stroke-width="2">
    <line x1="600" y1="240" x2="165" y2="119"/><line x1="600" y1="240" x2="410" y2="119"/>
    <line x1="600" y1="240" x2="790" y2="119"/><line x1="600" y1="240" x2="1035" y2="119"/>
    <line x1="600" y1="240" x2="165" y2="349"/><line x1="600" y1="240" x2="405" y2="380"/>
    <line x1="600" y1="240" x2="795" y2="380"/><line x1="600" y1="240" x2="1035" y2="349"/>
  </g>
  <g font-family="Pretendard, 'Noto Sans KR', 'Apple SD Gothic Neo', Arial, sans-serif" text-anchor="middle">
    <circle cx="600" cy="240" r="84" fill="url(#core)" filter="url(#glow)"/>
    <circle cx="600" cy="240" r="69" fill="#0a2949" stroke="#9bd1ff" stroke-opacity=".72"/>
    <text x="600" y="222" fill="#8fcaff" font-size="12" font-weight="800" letter-spacing="2">AI · AX</text>
    <text x="600" y="246" fill="#ffffff" font-size="27" font-weight="900" letter-spacing="1">YEHAVHA</text>
    <text x="600" y="273" fill="#bfe3ff" font-size="22" font-weight="800">NEXUS</text>
    <g fill="#0e2945" stroke="#5c91bd" stroke-width="1.5">
      <rect x="70" y="92" width="190" height="54" rx="14"/><rect x="315" y="92" width="190" height="54" rx="14"/>
      <rect x="695" y="92" width="190" height="54" rx="14"/><rect x="940" y="92" width="190" height="54" rx="14"/>
      <rect x="70" y="322" width="190" height="54" rx="14"/><rect x="310" y="353" width="190" height="54" rx="14"/>
      <rect x="700" y="353" width="190" height="54" rx="14"/><rect x="940" y="322" width="190" height="54" rx="14"/>
    </g>
    <g fill="#eaf4ff" font-size="16" font-weight="800">
      <text x="165" y="125">NEXUS UNIVERSITY</text><text x="410" y="125">정부 AX 전략·대응</text>
      <text x="790" y="125">정보·전략</text><text x="1035" y="125">연구·지식</text>
      <text x="165" y="355">웹앱·서비스</text><text x="405" y="386">교육·강좌</text>
      <text x="795" y="386">출판·아카이브</text><text x="1035" y="355">미디어·콘텐츠</text>
    </g>
    <rect x="505" y="416" width="190" height="30" rx="11" fill="#102e4c" stroke="#5c91bd"/>
    <text x="600" y="437" fill="#b9d8f5" font-size="14" font-weight="800">아이디어 허브</text>
  </g>
</svg>
