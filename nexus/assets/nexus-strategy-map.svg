<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">YEHAVHA NEXUS AI·AX 전략 시스템</title>
  <desc id="desc">지식에서 전략으로, 전략에서 대응으로. 파란색 지구와 도시, AI 아이콘으로 구성된 전략 시스템 비주얼.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06162d"/>
      <stop offset=".42" stop-color="#0b3d78"/>
      <stop offset=".76" stop-color="#1269b5"/>
      <stop offset="1" stop-color="#0b3d76"/>
    </linearGradient>
    <radialGradient id="globe" cx="38%" cy="30%" r="78%">
      <stop offset="0" stop-color="#42c8ff"/>
      <stop offset=".5" stop-color="#1475c8"/>
      <stop offset="1" stop-color="#083c78"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#58d6ff" stop-opacity=".32"/>
      <stop offset="1" stop-color="#58d6ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#39d6ff" stop-opacity="0"/>
      <stop offset=".48" stop-color="#39d6ff" stop-opacity=".28"/>
      <stop offset=".72" stop-color="#9c8cff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#ffd46a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="building" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c8e8ff" stop-opacity=".9"/>
      <stop offset="1" stop-color="#4e9fe0" stop-opacity=".44"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#b9e7ff" opacity=".12"/>
    </pattern>
  </defs>

