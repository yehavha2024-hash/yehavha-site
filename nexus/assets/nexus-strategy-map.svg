    <radialGradient id="goldGlow" cx="58%" cy="72%" r="32%">
      <stop offset="0" stop-color="#ffd56a" stop-opacity=".20"/>
      <stop offset="1" stop-color="#ffd56a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="networkLine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5de2ff" stop-opacity=".25"/>
      <stop offset=".45" stop-color="#7cb7ff" stop-opacity=".82"/>
      <stop offset=".78" stop-color="#a987ff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ffd66b" stop-opacity=".40"/>
    </linearGradient>
    <linearGradient id="corePanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123f70" stop-opacity=".97"/>
      <stop offset=".58" stop-color="#0c2b50" stop-opacity=".97"/>
      <stop offset="1" stop-color="#111d3c" stop-opacity=".98"/>
    </linearGradient>
    <linearGradient id="aurora1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1dc8ff" stop-opacity="0"/>
      <stop offset=".42" stop-color="#1dc8ff" stop-opacity=".34"/>
      <stop offset=".72" stop-color="#8c75ff" stop-opacity=".24"/>
      <stop offset="1" stop-color="#8c75ff" stop-opacity="0"/>
