      <stop offset="0" stop-color="#04101f"/>
      <stop offset=".52" stop-color="#082b50"/>
      <stop offset="1" stop-color="#07182e"/>
    </linearGradient>
    <radialGradient id="blueGlow" cx="70%" cy="42%" r="58%">
      <stop offset="0" stop-color="#2e8fe8" stop-opacity=".34"/>
      <stop offset=".55" stop-color="#2e8fe8" stop-opacity=".08"/>
      <stop offset="1" stop-color="#2e8fe8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violetGlow" cx="88%" cy="12%" r="42%">
      <stop offset="0" stop-color="#8c6cff" stop-opacity=".26"/>
      <stop offset="1" stop-color="#8c6cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123d69" stop-opacity=".96"/>
      <stop offset="1" stop-color="#0a223e" stop-opacity=".96"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5bc7ff" stop-opacity=".2"/>
      <stop offset=".5" stop-color="#7db8ff" stop-opacity=".76"/>
      <stop offset="1" stop-color="#a87bff" stop-opacity=".3"/>
    </linearGradient>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="nodeGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

