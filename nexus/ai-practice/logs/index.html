<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="description" content="YEHAVHA Nexus AI 실무·아이디어 실행 기록. 실제 실행 결과, 실패, 수정사항과 다음 표준을 누적합니다."/>
<meta name="theme-color" content="#081a30"/>
<title>실행 기록 | AI 실무·아이디어 | YEHAVHA Nexus</title>
<link href="../../portal-v2.css?v=20260812-2035" rel="stylesheet"/>
<style>
:root{--line:rgba(135,181,230,.22);--soft:rgba(122,184,255,.08);--text:#c7d6e5}
.log-hero{padding:28px 0 18px}.back-link{display:inline-flex;margin:0 0 18px;color:#c9d9ea;text-decoration:none}.log-hero-card{padding:32px}.log-hero-card h1{margin:.2rem 0 .8rem;font-size:clamp(2rem,5vw,3.5rem)}.log-hero-card h1 span{display:block;color:#b8d8f8;font-size:.46em;margin-top:.4rem}.log-hero-card p{max-width:940px;color:#b8c9dc;line-height:1.8}.runs{display:grid;gap:18px}.run{border:1px solid var(--line);border-radius:24px;background:linear-gradient(180deg,rgba(15,37,63,.9),rgba(7,23,42,.9));padding:26px;box-shadow:0 18px 54px rgba(0,0,0,.18)}.run-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.run h2{margin:.25rem 0 .5rem;color:#f4f8fc;font-size:clamp(1.35rem,3vw,1.85rem)}.meta{color:#7fa8cc;font-size:.82rem;font-weight:800;letter-spacing:.05em}.badges{display:flex;gap:7px;flex-wrap:wrap}.badge{padding:5px 9px;border-radius:999px;border:1px solid rgba(122,184,255,.2);background:var(--soft);color:#d8eaff;font-size:.74rem;font-weight:800}.objective{color:#c5d3e1;line-height:1.78}.block{margin-top:18px;padding-top:17px;border-top:1px solid rgba(135,181,230,.14)}.block h3{margin:0 0 10px;color:#8fbde8;font-size:.82rem;letter-spacing:.08em}.chips{display:flex;flex-wrap:wrap;gap:7px}.chip{padding:6px 9px;border:1px solid rgba(122,184,255,.15);border-radius:999px;background:rgba(122,184,255,.06);color:#cbd9e7;font-size:.77rem}.list{margin:0;padding-left:1.2rem;color:var(--text);line-height:1.75}.list li+li{margin-top:5px}.sources{display:grid;gap:12px}.source{padding:15px;border:1px solid rgba(135,181,230,.15);border-radius:15px;background:rgba(4,18,34,.38)}.source-top{display:flex;justify-content:space-between;gap:10px}.source h4{margin:0;color:#edf5fc;font-size:.98rem;line-height:1.5}.source a{color:#8fc4f5;text-decoration:none}.source a:hover{text-decoration:underline}.source p{margin:.55rem 0 0;color:#b6c6d6;font-size:.9rem;line-height:1.7}.rank{font-weight:900;color:#dbeeff}.failure{padding:14px 15px;border-left:3px solid rgba(255,190,105,.6);background:rgba(255,190,105,.05);border-radius:12px;color:#c7d4df;line-height:1.7}.failure strong{color:#f2d2a4}.failure+.failure{margin-top:10px}.standard{padding:12px 13px;border-radius:12px;background:rgba(122,184,255,.07);border:1px solid rgba(122,184,255,.14);color:#d3e2ef;line-height:1.7}.standard+.standard{margin-top:8px}@media(max-width:700px){.log-hero-card,.run{padding:19px;border-radius:18px}.run-top,.source-top{display:block}.badges{margin-top:10px}.source .badge{display:inline-flex;margin-top:8px}}
</style>
</head>
<body>
<a class="skip-link" href="#runs">실행 기록으로 이동</a>
<header class="log-hero" id="top"><div class="container"><a class="back-link" href="../">← AI 실무·아이디어 실행 자료실</a><section class="hero-card log-hero-card"><p class="eyebrow">EXECUTION LOG</p><h1>실행 기록 <span>결과 · 실패 · 수정 · 표준화</span></h1><p>실행 항목을 실제로 수행한 뒤 얻은 결과와 잘못된 전제, 검색 실패, 수정 방식, 다음 작업에 재사용할 표준을 삭제하지 않고 누적합니다.</p></section></div></header>
<main class="main"><div class="container"><div class="runs" id="runs"></div></div></main>
<footer class="footer"><div class="container"><div class="footer-card"><strong>YEHAVHA Nexus · AI Practice Execution Log</strong><p>실행 결과를 다음 작업의 표준으로 전환합니다.</p><a href="#top">맨 위로 이동 ↑</a><div class="footer-meta"><p>Copyright © 이명훈. All rights reserved.</p></div></div></div></footer>
<script>
(()=>{'use strict';
const root=document.getElementById('runs');
function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n}
function listBlock(parent,title,items){if(!Array.isArray(items)||!items.length)return;const b=el('section','block');b.append(el('h3','',title));const ul=el('ul','list');items.forEach(x=>ul.append(el('li','',x)));b.append(ul);parent.append(b)}
function renderRun(run){const a=el('article','run');const top=el('div','run-top');const left=el('div');left.append(el('div','meta',`${run.date} · ${run.id}`),el('h2','',run.itemTitle));const badges=el('div','badges');badges.append(el('span','badge',run.priority||''),el('span','badge',run.status||''));top.append(left,badges);a.append(top,el('p','objective',run.objective||''));
if(run.keywords?.length){const b=el('section','block');b.append(el('h3','','고정 키워드'));const row=el('div','chips');run.keywords.forEach(x=>row.append(el('span','chip',x)));b.append(row);a.append(b)}
listBlock(a,'실행 방법',run.method);
if(run.results?.length){const b=el('section','block');b.append(el('h3','','선별 결과'));const wrap=el('div','sources');run.results.forEach(s=>{const c=el('article','source');const st=el('div','source-top');const h=el('h4');const link=el('a','',s.title);link.href=s.url;link.target='_blank';link.rel='noopener noreferrer';h.append(link);st.append(h,el('span','badge rank',`${s.rank} · ${s.classification}`));c.append(st,el('p','',`${s.publisher} · ${s.date}`),el('p','',`핵심: ${s.keyPoint}`),el('p','',`연구 적용: ${s.researchUse}`),el('p','',`주의: ${s.caution}`));wrap.append(c)});b.append(wrap);a.append(b)}
if(run.failures?.length){const b=el('section','block');b.append(el('h3','','실패와 수정'));run.failures.forEach(f=>{const c=el('div','failure');c.innerHTML=`<strong>문제</strong> ${f.issue}<br><strong>원인</strong> ${f.cause}<br><strong>수정</strong> ${f.correction}`;b.append(c)});a.append(b)}
listBlock(a,'실행 결과물',run.outputs);
if(run.standardsAdded?.length){const b=el('section','block');b.append(el('h3','','이번 실행에서 추가된 표준'));run.standardsAdded.forEach(x=>b.append(el('div','standard',x)));a.append(b)}
listBlock(a,'다음 행동',run.nextActions);return a}
async function load(){try{const r=await fetch('../runs.json',{cache:'no-store'});if(!r.ok)throw new Error(`HTTP ${r.status}`);const d=await r.json();root.replaceChildren();(d.runs||[]).slice().reverse().forEach(run=>root.append(renderRun(run)))}catch(e){console.error(e);root.append(el('p','objective','실행 기록을 불러오지 못했습니다.'))}}
load();})();
</script>
</body>
</html>
